name: check-prices

on:
  schedule:
    - cron: "17 6 * * *"          # daily ~06:17 UTC
  workflow_dispatch:
    inputs:
      add_url:
        description: "Optional: a product URL to start tracking"
        required: false
        default: ""
      label:
        description: "Optional label for that URL"
        required: false
        default: ""
      target:
        description: "Optional target price (email alert when it drops to this)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "data/products.json"
      - "tracker/**"
      - "site/index.html"
      - "site/app.js"
      - "site/style.css"
      - ".github/workflows/check-prices.yml"

permissions:
  contents: write        # commit updated price history
  pages: write           # publish the dashboard
  id-token: write
  issues: write          # open an issue (-> email) on a price drop

env:
  # alert when a check comes in >= this % below the previous check
  ALERT_DROP_PCT: "5"
  # set to "1" to also alert after 3 consecutive failed checks for a product
  ALERT_ON_FAIL: "1"

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # don't loop on the bot's own history commits
    if: >-
      github.event_name != 'push' ||
      github.event.head_commit.author.name != 'price-bot'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Add URL (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.add_url != '' }}
        env:
          ADD_URL: ${{ inputs.add_url }}
          ADD_LABEL: ${{ inputs.label }}
          ADD_TARGET: ${{ inputs.target }}
        run: python -m tracker.check add "$ADD_URL" --label "$ADD_LABEL" --target "$ADD_TARGET" --no-check

      - name: Check prices
        run: python -m tracker.check run

      - name: Commit updated history
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/ site/dashboard.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "prices: $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # non-blocking: a hiccup here must never fail the data pipeline above
      - name: Open issues for price drops
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m tracker.check alerts > /tmp/alerts.json
          n=$(jq 'length' /tmp/alerts.json)
          echo "$n alert(s)"
          if [ "$n" -gt 0 ]; then
            gh label create price-drop --color BFD4F2 --description "Automated price alert" --force >/dev/null 2>&1 || true
            existing=$(gh issue list --state open --label price-drop --limit 100 --json title --jq '.[].title' || true)
            for i in $(seq 0 $((n - 1))); do
              title=$(jq -r ".[$i].title" /tmp/alerts.json)
              body=$(jq -r ".[$i].body" /tmp/alerts.json)
              if printf '%s\n' "$existing" | grep -Fxq "$title"; then
                echo "already open: $title"
              else
                gh issue create --title "$title" --body "$body" --label price-drop || echo "could not create: $title"
              fi
            done
          fi
